name: EkoBot Daily Run

on:
  schedule:
    # Čas je v UTC (05:00 UTC = 07:00 našeho času)
    - cron: '0 5,10,17 * * *'
  workflow_dispatch: # Tohle ti umožní to spustit ručně tlačítkem

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EkoBot
        env:
          # Tady GitHub propojí tvoje Secrets s Pythonem
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python script.py

      - name: Commit and push seen_urls.txt
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add seen_urls.txt
          git commit -m "Update seen_urls.txt [skip ci]" || echo "No changes to commit"
          git push
