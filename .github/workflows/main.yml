name: EkoBot Daily Run

on:
  schedule:
    # Změněno z 0 na 12 a 24 minutu, aby se workflow vyhnulo špičce
    - cron: '15 6,13,18 * * *'
  workflow_dispatch:

# Přidáno oprávnění k zápisu do repozitáře (nutné pro git push)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run EkoBot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python script.py

      - name: Commit and push seen_urls.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_urls.txt
          # Commitne jen pokud jsou změny, aby krok neskončil chybou
          git commit -m "Update seen_urls.txt [skip ci]" || echo "No changes to commit"
          git push
